<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin - Legacy</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDcHrvQdD3wyEFUrwka0mZuAehJPtzsag4", authDomain: "legacy-secondary.firebaseapp.com", projectId: "legacy-secondary", storageBucket: "legacy-secondary.firebasestorage.app", messagingSenderId: "929548927280", appId: "1:929548927280:web:f565195bf94b04ae5ec8f5" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

window.addStudent = async () => {
 const name=document.getElementById('sname').value; const adm=document.getElementById('sadm').value; const cls=document.getElementById('scls').value; const email=document.getElementById('semail').value; const pass=document.getElementById('spass').value; const fee=document.getElementById('sfee').value;
 if(!name||!email||!pass) return alert("Fill in name, email, and password");
 try{ const cred=await createUserWithEmailAndPassword(auth,email,pass); await setDoc(doc(db,"students",cred.user.uid),{name,adm,class:cls,feeBalance:fee,meanGrade:"B+",email,createdAt:new Date()}); alert("Student "+name+" added! Login: "+email); }catch(e){alert(e.message)}
}
window.addStaff = async () => {
 const name=document.getElementById('tname').value; const role=document.getElementById('trole').value; const email=document.getElementById('temail').value; const pass=document.getElementById('tpass').value;
 if(!name||!email||!pass) return alert("Fill in name, email, and password");
 try{ const cred=await createUserWithEmailAndPassword(auth,email,pass); await setDoc(doc(db,"staff",cred.user.uid),{name,email,role,createdAt:new Date()}); alert("Staff "+name+" added! Login: "+email); }catch(e){alert(e.message)}
}
window.showTab=(id)=>{ document.getElementById('tab-student').classList.add('hidden'); document.getElementById('tab-staff').classList.add('hidden'); document.getElementById(id).classList.remove('hidden'); }
</script></head>
<body class="bg-gray-100 min-h-screen p-6">
<h1 class="font-bold text-2xl text-blue-900">Legacy Admin Panel</h1><p class="text-xs text-red-600 mt-1">KEEP THIS PAGE PRIVATE: do not share this link with students!</p>
<div class="flex gap-2 mt-6"><button onclick="showTab('tab-student')" class="bg-blue-800 text-white px-5 py-2 rounded-full text-sm">+ Add Student</button><button onclick="showTab('tab-staff')" class="bg-yellow-500 text-blue-900 font-bold px-5 py-2 rounded-full text-sm">+ Add Staff</button></div>

<div id="tab-student" class="bg-white p-6 rounded-2xl max-w-md mt-6 shadow space-y-3">
<h2 class="font-bold">Add Student</h2>
<input id="sname" placeholder="Full Name e.g John Mwenda" class="w-full border p-3 rounded-xl">
<input id="sadm" placeholder="Adm No e.g LM/001/24" class="w-full border p-3 rounded-xl">
<input id="scls" placeholder="Class e.g Form 2 East" class="w-full border p-3 rounded-xl">
<input id="semail" placeholder="Email e.g john@legacy.sc.ke" class="w-full border p-3 rounded-xl">
<input id="spass" placeholder="Password e.g 123456" class="w-full border p-3 rounded-xl">
<input id="sfee" placeholder="Fee Balance e.g 15000" class="w-full border p-3 rounded-xl">
<button onclick="addStudent()" class="w-full bg-blue-800 text-white py-3 rounded-full font-bold">Save Student</button>
</div>

<div id="tab-staff" class="hidden bg-white p-6 rounded-2xl max-w-md mt-6 shadow space-y-3">
<h2 class="font-bold">Add Staff / Teacher</h2>
<input id="tname" placeholder="Full Name e.g Mr. Voste" class="w-full border p-3 rounded-xl">
<input id="trole" placeholder="Role e.g Principal, Maths Teacher" class="w-full border p-3 rounded-xl">
<input id="temail" placeholder="Email e.g voste@legacy.sc.ke" class="w-full border p-3 rounded-xl">
<input id="tpass" placeholder="Password e.g Teacher123" class="w-full border p-3 rounded-xl">
<button onclick="addStaff()" class="w-full bg-blue-900 text-white py-3 rounded-full font-bold">Save Staff</button>
<p class="text-[11px] text-gray-500">This staff member will log in via the staff portal</p>
</div>

<div class="max-w-md mt-8 bg-yellow-100 p-4 rounded-xl text-xs">
</div>
</body></html>
