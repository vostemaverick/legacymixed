<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Staff Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDcHrvQdD3wyEFUrwka0mZuAehJPtzsag4",
      authDomain: "legacy-secondary.firebaseapp.com",
      projectId: "legacy-secondary",
      storageBucket: "legacy-secondary.firebasestorage.app",
      messagingSenderId: "929548927280",
      appId: "1:929548927280:web:f565195bf94b04ae5ec8f5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.loginStaff = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('pass').value;

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const snapshot = await getDoc(doc(db, "staff", credential.user.uid));

        if (!snapshot.exists()) {
          alert("Not staff");
          return;
        }

        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dash').classList.remove('hidden');
        document.getElementById('tName').innerText = snapshot.data().name;

        if ((snapshot.data().role || '').toLowerCase() === 'principal' || (snapshot.data().role || '').toLowerCase() === 'admin') {
          document.getElementById('adminLink').classList.remove('hidden');
        }

        loadStudents();
      } catch (error) {
        alert(error.message);
      }
    };

    async function loadStudents() {
      const querySnapshot = await getDocs(collection(db, "students"));
      let html = "";
      const studentSelect = document.getElementById('resultStudent');
      studentSelect.replaceChildren(new Option("Select a student", ""));

      querySnapshot.forEach((document) => {
        const student = document.data();
        const option = new Option(`${student.name} (${student.adm || document.id})`, document.id);
        studentSelect.add(option);
        html += `
          <tr class="border-b">
            <td class="p-3">${student.name}</td>
            <td class="p-3">${student.adm}</td>
            <td class="p-3">${student.class}</td>
            <td class="p-3"><input id="grade-${document.id}" value="${student.meanGrade || ''}" class="border p-1 w-20 rounded"></td>
            <td class="p-3"><input id="fee-${document.id}" value="${student.feeBalance || 0}" class="border p-1 w-24 rounded"></td>
            <td class="p-3"><button onclick="saveStudent('${document.id}')" class="bg-blue-800 text-white px-3 py-1 rounded text-xs">Save</button></td>
          </tr>`;
      });

      document.getElementById('studentList').innerHTML = html || "<tr><td colspan=6 class='p-4 text-center'>No students</td></tr>";
    }

    window.submitScheme = async () => {
      const subject = document.getElementById('schemeSubject').value.trim();
      const studentClass = document.getElementById('schemeClass').value.trim();
      const term = document.getElementById('schemeTerm').value.trim();
      const week = document.getElementById('schemeWeek').value.trim();
      const topic = document.getElementById('schemeTopic').value.trim();
      const objectives = document.getElementById('schemeObjectives').value.trim();

      if (!subject || !studentClass || !term || !week || !topic || !objectives) {
        alert("Complete all scheme of work fields before submitting.");
        return;
      }

      try {
        await addDoc(collection(db, "schemesOfWork"), {
          subject,
          class: studentClass,
          term,
          week,
          topic,
          objectives,
          submittedBy: auth.currentUser.uid,
          submittedByEmail: auth.currentUser.email,
          submittedAt: new Date()
        });
        document.getElementById('schemeForm').reset();
        alert("Scheme of work submitted.");
      } catch (error) {
        console.error("Scheme submission failed:", error);
        alert(`Unable to submit the scheme of work: ${error.message}`);
      }
    };

    window.submitResult = async () => {
      const studentId = document.getElementById('resultStudent').value;
      const subject = document.getElementById('resultSubject').value.trim();
      const term = document.getElementById('resultTerm').value.trim();
      const score = Number(document.getElementById('resultScore').value);
      const maxScore = Number(document.getElementById('resultMaxScore').value);
      const studentOption = document.getElementById('resultStudent').selectedOptions[0];

      if (!studentId || !subject || !term || !Number.isFinite(score) ||
          !Number.isFinite(maxScore) || score < 0 || maxScore <= 0 || score > maxScore) {
        alert("Select a student, enter the subject and term, and enter a valid score.");
        return;
      }

      try {
        await addDoc(collection(db, "results"), {
          studentId,
          studentName: studentOption.textContent,
          subject,
          term,
          score,
          maxScore,
          submittedBy: auth.currentUser.uid,
          submittedAt: new Date()
        });
        document.getElementById('resultForm').reset();
        alert("Student result saved.");
      } catch (error) {
        console.error("Student result submission failed:", error);
        alert(`Unable to save the student result: ${error.message}`);
      }
    };

    window.saveStudent = async (id) => {
      await updateDoc(doc(db, "students", id), {
        meanGrade: document.getElementById(`grade-${id}`).value,
        feeBalance: document.getElementById(`fee-${id}`).value
      });
      alert("Updated!");
    };

    window.postNotice = async () => {
      const title = document.getElementById('nTitle').value;
      const message = document.getElementById('nMsg').value;

      if (!title || !message) {
        return alert("Please enter a title and message.");
      }

      await addDoc(collection(db, "notices"), {
        title,
        message,
        date: new Date(),
        by: auth.currentUser.email
      });

      alert("Posted!");
    };

    window.logout = () => signOut(auth).then(() => location.reload());
  </script>
</head>
<body class="bg-gray-50">
  <nav class="bg-blue-900 text-white p-4 flex justify-between">
    <a href="index.html" class="font-bold">LEGACY STAFF</a>
    <button onclick="logout()" class="text-xs border px-3 py-1 rounded-full">Logout</button>
  </nav>

  <div id="loginBox" class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-2xl shadow">
    <h2 class="font-bold text-xl">Staff Login</h2>
    <input id="email" type="email" placeholder="Email" class="w-full border p-3 mt-5 rounded-xl">
    <input id="pass" type="password" placeholder="Password" class="w-full border p-3 mt-3 rounded-xl">
    <button onclick="loginStaff()" class="w-full bg-blue-900 text-white py-3 mt-5 rounded-full font-bold">Login</button>
  </div>

  <div id="dash" class="hidden max-w-6xl mx-auto mt-6 p-4">
    <div class="flex justify-between items-center flex-wrap gap-2">
      <div>
        <h2 class="text-2xl font-bold">Teacher <span id="tName"></span></h2>
        <a id="adminLink" href="admin-portal.html" class="hidden mt-2 inline-block bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">🔐 ADMIN PANEL - Add Students/Staff</a>
      </div>
      <a href="index.html" class="text-sm">Home</a>
    </div>

    <div class="grid md:grid-cols-3 gap-4 mt-6">
      <div class="md:col-span-2 bg-white rounded-2xl shadow p-5">
        <h3 class="font-bold">Students</h3>
        <div class="overflow-auto mt-4">
          <table class="w-full text-sm">
            <thead class="bg-gray-100">
              <tr>
                <th class="p-3 text-left">Name</th>
                <th>ADM</th>
                <th>Class</th>
                <th>Grade</th>
                <th>Fee</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="studentList"></tbody>
          </table>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow p-5">
        <h3 class="font-bold">Post Notice</h3>
        <input id="nTitle" placeholder="Title" class="w-full border p-3 mt-4 rounded-xl">
        <textarea id="nMsg" placeholder="Message" class="w-full border p-3 mt-3 rounded-xl h-28"></textarea>
        <button onclick="postNotice()" class="w-full bg-yellow-500 text-blue-900 font-bold py-3 mt-3 rounded-full">Post Notice</button>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4 mt-6">
      <form id="schemeForm" onsubmit="event.preventDefault(); submitScheme();" class="bg-white rounded-2xl shadow p-5 space-y-3">
        <h3 class="font-bold">Submit Scheme of Work</h3>
        <input id="schemeSubject" required placeholder="Subject" class="w-full border p-3 rounded-xl">
        <input id="schemeClass" required placeholder="Class" class="w-full border p-3 rounded-xl">
        <input id="schemeTerm" required placeholder="Term (e.g. Term 1, 2026)" class="w-full border p-3 rounded-xl">
        <input id="schemeWeek" required placeholder="Week" class="w-full border p-3 rounded-xl">
        <input id="schemeTopic" required placeholder="Topic" class="w-full border p-3 rounded-xl">
        <textarea id="schemeObjectives" required placeholder="Learning objectives" class="w-full border p-3 rounded-xl h-28"></textarea>
        <button type="submit" class="w-full bg-blue-800 text-white py-3 rounded-full font-bold">Submit Scheme</button>
      </form>

      <form id="resultForm" onsubmit="event.preventDefault(); submitResult();" class="bg-white rounded-2xl shadow p-5 space-y-3">
        <h3 class="font-bold">Enter Student Result</h3>
        <select id="resultStudent" required class="w-full border p-3 rounded-xl">
          <option value="">Select a student</option>
        </select>
        <input id="resultSubject" required placeholder="Subject" class="w-full border p-3 rounded-xl">
        <input id="resultTerm" required placeholder="Term (e.g. Term 1, 2026)" class="w-full border p-3 rounded-xl">
        <input id="resultScore" required type="number" min="0" step="any" placeholder="Score" class="w-full border p-3 rounded-xl">
        <input id="resultMaxScore" required type="number" min="0.01" step="any" placeholder="Maximum score" class="w-full border p-3 rounded-xl">
        <button type="submit" class="w-full bg-blue-800 text-white py-3 rounded-full font-bold">Save Result</button>
      </form>
    </div>
  </div>
</body>
</html>
