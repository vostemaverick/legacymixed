<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Student Portal - Legacy</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDcHrvQdD3wyEFUrwka0mZuAehJPtzsag4", authDomain: "legacy-secondary.firebaseapp.com", projectId: "legacy-secondary", storageBucket: "legacy-secondary.firebasestorage.app", messagingSenderId: "929548927280", appId: "1:929548927280:web:f565195bf94b04ae5ec8f5" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
window.login = async () => {
 const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value;
 if(!e||!p){ alert("Enter your school email and password."); return; }
 try{ const c=await signInWithEmailAndPassword(auth,e,p); const s=await getDoc(doc(db,"students",c.user.uid));
 if(!s.exists()){ await signOut(auth); alert("No student profile is linked to this account. Contact the school administrator."); return;} const d=s.data();
 document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden');
 document.getElementById('sName').innerText=d.name; document.getElementById('sAdm').innerText=d.adm; document.getElementById('sClass').innerText=d.class; document.getElementById('sBal').innerText="KES "+d.feeBalance; document.getElementById('sMean').innerText=d.meanGrade || "N/A";
 await loadResults(c.user.uid);
 }catch(err){console.error("Student portal Firebase login failed:",err); alert("Unable to sign in or load your student profile. Check your connection and credentials, then try again. "+err.message)}
}
async function loadResults(studentId){
 const resultsQuery=query(collection(db,"results"),where("studentId","==",studentId));
 const snapshot=await getDocs(resultsQuery);
 const body=document.getElementById('resultRows');
 body.replaceChildren();
 snapshot.forEach((resultDoc)=>{
  const result=resultDoc.data();
  const row=document.createElement('tr');
  [result.subject,result.term,`${result.score} / ${result.maxScore}`].forEach((value)=>{
   const cell=document.createElement('td');
   cell.className="border-b p-3";
   cell.textContent=value ?? "";
   row.appendChild(cell);
  });
  body.appendChild(row);
 });
 if(snapshot.empty){
  const row=document.createElement('tr');
  const cell=document.createElement('td');
  cell.colSpan=3;
  cell.className="p-4 text-center text-gray-500";
  cell.textContent="No results have been posted yet.";
  row.appendChild(cell);
  body.appendChild(row);
 }
}
window.logout=()=>signOut(auth).then(()=>location.reload());
</script></head>
<body class="bg-gray-50"><nav class="bg-blue-800 text-white p-4 flex justify-between"><a href="index.html" class="font-bold">LEGACY MIXED</a><a href="staff-portal.html" class="text-xs border px-3 py-1 rounded-full">Staff Portal</a></nav>
<div id="loginBox" class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-2xl shadow"><h2 class="font-bold text-xl text-blue-800">Student Portal</h2><p class="text-xs text-gray-500 mt-1">Login with your school email</p><input id="email" type="email" placeholder="student@legacy.sc.ke" class="w-full border p-3 mt-5 rounded-xl"><input id="pass" type="password" placeholder="Password" class="w-full border p-3 mt-3 rounded-xl"><button onclick="login()" class="w-full bg-blue-800 text-white py-3 mt-5 rounded-full font-bold">Login</button><p class="text-[11px] text-center mt-3">Contact admin: 0790774697</p></div>
<div id="dash" class="hidden max-w-3xl mx-auto mt-8 p-6"><div class="flex justify-between items-center"><div><h2 class="text-2xl font-bold">Hello, <span id="sName"></span></h2><p class="text-sm">Admission No: <span id="sAdm"></span> | Class: <span id="sClass"></span></p></div><button onclick="logout()" class="text-sm text-red-600">Logout</button></div><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-6"><div class="bg-white p-5 rounded-2xl shadow"><p class="text-xs text-gray-500">Fee Balance</p><p id="sBal" class="font-bold text-lg mt-1"></p></div><div class="bg-white p-5 rounded-2xl shadow"><p class="text-xs text-gray-500">Mean Grade</p><p id="sMean" class="font-bold text-lg mt-1"></p></div><div class="bg-blue-800 text-white p-5 rounded-2xl shadow"><p class="text-xs">Contact School</p><a href="https://wa.me/254790774697" class="font-bold text-sm underline">WhatsApp 0790 774 697</a></div></div><section class="bg-white p-5 mt-6 rounded-2xl shadow"><h3 class="font-bold text-lg">Subject Results</h3><div class="overflow-x-auto mt-3"><table class="w-full text-sm text-left"><thead><tr class="bg-gray-100"><th class="p-3">Subject</th><th class="p-3">Term</th><th class="p-3">Score</th></tr></thead><tbody id="resultRows"></tbody></table></div></section></div></body></html>
