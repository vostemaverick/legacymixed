<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin - Legacy</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, updatePassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth as getAuth2, createUserWithEmailAndPassword as createUser2 } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyDcHrvQdD3wyEFUrwka0mZuAehJPtzsag4", authDomain: "legacy-secondary.firebaseapp.com", projectId: "legacy-secondary", storageBucket: "legacy-secondary.firebasestorage.app", messagingSenderId: "929548927280", appId: "1:929548927280:web:f565195bf94b04ae5ec8f5" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = (await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js")).getFirestore(app);

// For creating users without logging out admin
const secondaryApp = initializeApp(firebaseConfig, "secondary");
const secondaryAuth = getAuth(secondaryApp);

window.loginAdmin = async () => {
  const e=document.getElementById('email').value; const p=document.getElementById('pass').value;
  try{
    const cred=await signInWithEmailAndPassword(auth,e,p);
    const snap=await getDoc(doc(db,"staff",cred.user.uid));
    if(!snap.exists() || !['principal','admin'].includes((snap.data().role||'').toLowerCase())){ alert("Wewe si Admin/Principal"); await signOut(auth); return; }
    document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dash').classList.remove('hidden');
    document.getElementById('aName').innerText=snap.data().name;
  }catch(err){ alert(err.message) }
}
window.addStudent = async () => {
 const name=document.getElementById('sname').value; const adm=document.getElementById('sadm').value; const cls=document.getElementById('scls').value; const email=document.getElementById('semail').value; const pass=document.getElementById('spass').value; const fee=document.getElementById('sfee').value;
 if(!name||!email||!pass) return alert("Jaza name,email,pass");
 try{ const cred=await createUserWithEmailAndPassword(secondaryAuth,email,pass); await setDoc(doc(db,"students",cred.user.uid),{name,adm,class:cls,feeBalance:fee,meanGrade:"B+",email,createdAt:new Date()}); alert("Student added: "+email); }catch(e){alert(e.message)}
}
window.addStaff = async () => {
 const name=document.getElementById('tname').value; const role=document.getElementById('trole').value; const email=document.getElementById('temail').value; const pass=document.getElementById('tpass').value;
 if(!name||!email||!pass) return alert("Jaza name,email,pass");
 try{ const cred=await createUserWithEmailAndPassword(secondaryAuth,email,pass); await setDoc(doc(db,"staff",cred.user.uid),{name,email,role:role.toLowerCase(),createdAt:new Date()}); alert("Staff added: "+email); }catch(e){alert(e.message)}
}
window.changeMyPassword = async () => {
  const newPass=document.getElementById('newPass').value; if(newPass.length<6) return alert("Password lazima 6+ characters");
  try{ await updatePassword(auth.currentUser,newPass); alert("Password changed successfully!"); document.getElementById('newPass').value=""; }catch(e){ alert("Error: "+e.message+" - Toka login tena kama imekataa"); }
}
window.forgotPassword = async () => {
  const e=document.getElementById('email').value; if(!e) return alert("Weka email yako kwanza hapo juu");
  try{ await sendPasswordResetEmail(auth,e); alert("Reset link imetumwa kwa: "+e+" - Check inbox/spam"); }catch(err){ alert(err.message) }
}
window.showTab=(id)=>{ document.getElementById('tab-student').classList.add('hidden'); document.getElementById('tab-staff').classList.add('hidden'); document.getElementById('tab-settings').classList.add('hidden'); document.getElementById(id).classList.remove('hidden'); }
window.logout=()=>signOut(auth).then(()=>location.reload());
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
</script></head>
<body class="bg-gray-100 min-h-screen">
<nav class="bg-red-700 text-white p-4 flex justify-between"><span class="font-bold">🔐 LEGACY ADMIN</span><div class="flex gap-2"><a href="index.html" class="text-xs border px-3 py-1 rounded-full">Home</a><button onclick="logout()" class="text-xs bg-black px-3 py-1 rounded-full">Logout</button></div></nav>

<div id="loginBox" class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-2xl shadow">
<h2 class="font-bold text-xl">Admin Login</h2><p class="text-xs text-gray-500 mt-1">Principal / Admin only</p>
<input id="email" type="email" placeholder="Email" class="w-full border p-3 mt-5 rounded-xl"><input id="pass" type="password" placeholder="Password" class="w-full border p-3 mt-3 rounded-xl">
<button onclick="loginAdmin()" class="w-full bg-red-700 text-white py-3 mt-5 rounded-full font-bold">Login</button>
<button onclick="forgotPassword()" class="w-full text-xs mt-3 text-blue-700 underline">Forgot password? Send reset link</button>
</div>

<div id="dash" class="hidden max-w-5xl mx-auto p-4 mt-4">
<h2 class="text-xl font-bold">Welcome <span id="aName"></span></h2>
<div class="flex gap-2 mt-6 flex-wrap"><button onclick="showTab('tab-student')" class="bg-blue-800 text-white px-5 py-2 rounded-full text-sm">+ Student</button><button onclick="showTab('tab-staff')" class="bg-yellow-500 text-blue-900 font-bold px-5 py-2 rounded-full text-sm">+ Staff</button><button onclick="showTab('tab-settings')" class="bg-gray-800 text-white px-5 py-2 rounded-full text-sm">⚙️ My Password</button></div>

<div id="tab-student" class="bg-white p-6 rounded-2xl max-w-md mt-6 shadow space-y-3"><h2 class="font-bold">Add Student</h2><input id="sname" placeholder="Full Name" class="w-full border p-3 rounded-xl"><input id="sadm" placeholder="Adm No" class="w-full border p-3 rounded-xl"><input id="scls" placeholder="Class" class="w-full border p-3 rounded-xl"><input id="semail" placeholder="Email" class="w-full border p-3 rounded-xl"><input id="spass" placeholder="Password" class="w-full border p-3 rounded-xl"><input id="sfee" placeholder="Fee Balance" class="w-full border p-3 rounded-xl"><button onclick="addStudent()" class="w-full bg-blue-800 text-white py-3 rounded-full font-bold">Save Student</button></div>

<div id="tab-staff" class="hidden bg-white p-6 rounded-2xl max-w-md mt-6 shadow space-y-3"><h2 class="font-bold">Add Staff</h2><input id="tname" placeholder="Full Name" class="w-full border p-3 rounded-xl"><input id="trole" placeholder="Role: principal, admin, teacher" class="w-full border p-3 rounded-xl"><input id="temail" placeholder="Email" class="w-full border p-3 rounded-xl"><input id="tpass" placeholder="Password" class="w-full border p-3 rounded-xl"><button onclick="addStaff()" class="w-full bg-blue-900 text-white py-3 rounded-full font-bold">Save Staff</button></div>

<div id="tab-settings" class="hidden bg-white p-6 rounded-2xl max-w-md mt-6 shadow space-y-3"><h2 class="font-bold">⚙️ Change My Password</h2><p class="text-xs text-gray-500">Unaweza badilisha password yako mwenyewe hapa.</p><input id="newPass" type="password" placeholder="New Password (min 6 chars)" class="w-full border p-3 rounded-xl mt-2"><button onclick="changeMyPassword()" class="w-full bg-black text-white py-3 rounded-full font-bold">Update Password</button><hr class="my-4"><h3 class="font-bold text-sm">Umesahau?</h3><p class="text-xs text-gray-500">System itakutumia link kwa email yako ureset.</p><button onclick="forgotPassword()" class="w-full border border-blue-800 text-blue-800 py-3 mt-2 rounded-full font-bold">Send Reset Email</button></div>
</div>
</body></html>
